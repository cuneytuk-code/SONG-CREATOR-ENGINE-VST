name: Build VST3 - Music Studio
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-windows-vst3:
    name: Build Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B Build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build Build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Music-Studio-VST3-Windows
          path: Build/MusicStudioVST_artefacts/Release/
