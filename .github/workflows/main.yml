name: Build VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B Build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build Build --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Music-Studio-VST3-Windows
          path: Build/MusicStudioVST_artefacts/Release/VST3/
